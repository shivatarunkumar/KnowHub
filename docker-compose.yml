# Local KnowHub: every GCP service replaced by an emulator (see project.md §3.7).
# Start with ./scripts/bootstrap.sh (first time) or `docker compose up -d`.

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["${POSTGRES_HOST_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  gcs:
    image: fsouza/fake-gcs-server:1.56.1
    command:
      - -scheme=http
      - -port=4443
      - -backend=filesystem
      - -filesystem-root=/storage
      - -external-url=http://localhost:${GCS_HOST_PORT:-4443}
      - -public-host=localhost:${GCS_HOST_PORT:-4443}
    ports: ["${GCS_HOST_PORT:-4443}:4443"]
    volumes: [gcsdata:/storage]

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:585.0.0-emulators
    command: gcloud beta emulators pubsub start --project=${GCP_PROJECT_ID:-knowhub-local} --host-port=0.0.0.0:8085
    ports: ["${PUBSUB_HOST_PORT:-8085}:8085"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Only started when COMPOSE_PROFILES includes "ollama" (bootstrap enables it when
  # Ollama isn't already running on the host).
  ollama:
    image: ollama/ollama:0.34.2
    profiles: ["ollama"]
    volumes: [ollama:/root/.ollama]

  # One-off: create DB → migrate → seed → buckets, topics, subscriptions → AI models.
  init:
    build: ./infra/tools
    env_file: .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    volumes: [".:/workspace"]
    command: ["bash", "scripts/init.sh"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: { condition: service_healthy }
      pubsub: { condition: service_healthy }
      gcs: { condition: service_started }
    restart: "no"

  api:
    build:
      context: ./backend
      args: { INSTALL_DEV: "true" }
    env_file: .env
    environment:
      # inside a container "localhost" is the container itself
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_DOCKER:-http://host.docker.internal:11434}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./backend:/app"]
    ports: ["${API_HOST_PORT:-8000}:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    image: node:24.21.0-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
  gcsdata:
  ollama:
  web_node_modules:
  web_next:
