name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    name: Backend + database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      APP_ENV: local
      POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql+asyncpg://knowhub:knowhub@localhost:5432/knowhub
      TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            infra/tools/requirements.txt
      - run: pip install -r backend/requirements-dev.txt -r infra/tools/requirements.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Create, migrate and seed the database (same scripts as local/GCP)
        run: |
          bash database/scripts/init_db.sh
          python database/scripts/migrate.py up
          python database/scripts/seed.py
          python database/scripts/migrate.py up   # idempotent: second run is a no-op
      - name: Database tests
        run: pytest -q database/tests
      - name: Backend tests
        working-directory: backend
        run: pytest -q

  web:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
